# Review -> fix -> verify -> commit over a PULL REQUEST, answering the humans who
# asked for the changes.
#
# This is the most dangerous config in the bundle, and the flags say so: it edits
# a working tree that holds EXTERNALLY AUTHORED code, with an agent whose
# permission checks are disabled and which is not confined to the target. A
# prompt-injection payload in the pull request -- in the diff, in a review comment,
# in a commit message -- reaches the coder. It therefore needs -allow-untrusted-fix
# on the command line, per invocation, and no config file can grant that.
#
# Use it on a branch you are prepared to inspect commit by commit before pushing.
# The natural workflow is: review-pr first, read what it says, then fix-pr.
description: Fix a pull request's changes and answer its open conversations. Needs -allow-untrusted-fix.

extends: defaults

target:
  mode: pr
  pr: 0 # placeholder: pass -pr <number> on the command line

roles:
  coder: { agent: claude-coder, prompt: fix }
  review:
    # rotate, not `all`: this is a LOOP, so a lens a reviewer missed this round is
    # seen by a different one next round. The review- configs fan out because they
    # get a single round and nothing follows them.
    strategy: rotate
    prompts:
      - review-bugs
      - review-security
      - review-concurrency
      - { prompt: review-tests, final: true }

loop:
  review_only: false
  # Fewer rounds than fix-code. Every round rewrites the branch under a pull
  # request somebody else is reading, and a five-round run turns a reviewable
  # change into an unreviewable one.
  max_iterations: 3
  final_skip_run_edits: ["**/*_test.go"]

# The same gate as the other Go configs. It matters more here: the code being
# verified was written by somebody else, so "it still builds and passes" is the
# only claim in the run that no model produced.
verify:
  policy: no_regressions
  timeout: 15m
  commands:
    - name: fmt
      run: [make, fmt-check]
    - name: vet
      run: [go, vet, ./...]
    - name: test
      run: [go, test, -race, ./...]
    - name: lint
      run: [make, lint]
      optional: true
