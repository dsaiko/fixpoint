# Shared base for every task config. Not runnable on its own — it defines no
# roles. Reference it with `extends: defaults` and override what you need.
#
# See README.md in this directory for how bundles are found, how `extends`
# merges, and the security model. Comments here stay short on purpose: this file
# is meant to be copied and edited, and an essay is hard to diff.

description: Shared base for the other configs; inherit with 'extends'.

target:
  mode: directory # git-diff | pr | directory

  # target.path is intentionally unset: it defaults to the project root, so the
  # same command reviews the whole project from anywhere inside it.

  # In a git repository .gitignore already decides scope, so build output,
  # caches, and local binaries need no entry here. List only what is COMMITTED
  # but not worth reviewing. Patterns match at any depth unless anchored — use
  # "target/**" rather than "**/target/**" for a build directory, or it will also
  # match a source package called target. An entry with no wildcard at all
  # ("config/secrets") excludes that directory's contents too; one with a wildcard
  # matches names only, so use "**/node_modules/**" to take the contents as well.
  #
  # Entries here match case-sensitively, as written.
  #
  # Credential-shaped paths (.env*, *.pem, *.key, id_rsa, ...) are excluded by
  # fixpoint itself, in any casing, and cannot be re-enabled here.
  exclude:
    - "**/vendor/**" # committed dependencies
    - "**/testdata/**" # committed fixtures; remove to review them too

roles:
  # The shared reviewer pool. It lives here so that changing who reviews is ONE
  # edit rather than the same edit in every config -- which is how the panels
  # drifted apart before, and how a rename left three files disagreeing.
  #
  # This does not make defaults runnable: `--list` decides that on
  # roles.review.prompts, which is deliberately absent here. A config still has to
  # declare its own lenses, its own coder, and its own strategy; only the pool is
  # inherited.
  #
  # Inheriting it works because `extends` decodes the child OVER this file: keys
  # the child does not set survive, so a config that declares
  # roles.review.strategy and roles.review.prompts keeps this agents list. Setting
  # `agents` in a config REPLACES this list rather than adding to it, which is how
  # a config narrows the panel -- no shipped one does today; review-pr used to, and
  # stopped once the refutation round made a noisy reviewer cheap.
  #
  # codex earns its seat on measurement: across 19 runs it produced the highest
  # share of high-severity findings of any panel member (34 high + 1 critical), a
  # 6% rejection rate, and no marginal cost on ChatGPT-account auth -- the best
  # value per session here.
  #
  # RESTORED 2026-08-12, after the quota reset and the seeded-target benchmark
  # (bench/README.md, bench/results.csv, 16 models). On the 20-seed bench that
  # preceded the 2026-08-20 rebuild, deepseek-v4-flash scored a perfect 20/20
  # with zero noise -- the "flash trades depth for latency"
  # concern it was once passed over for did not survive measurement. The rest of
  # the 2026-08 sweep disqualified itself (timeouts, contract failures, or half
  # the recall at multiples of the tokens).
  #
  # deepseek-ollama MOVED FROM THE FLASH TIER TO THE PRO TIER 2026-08-20. The seat
  # is unchanged -- the agent file is what points at a model -- but the model is
  # now deepseek-v4-pro:0813-cloud, which the 100-seed bench separated from flash
  # (66/100 vs 52/100) where 20 seeds had them tied at perfect. Same route, same
  # quota, fewer tokens. It buys a better reviewer, NOT wider panel coverage:
  # against claude, codex and minimax both tiers contribute the same 3 seeds and
  # the panel covers 86/100 either way. Reasoning in deepseek-ollama.yaml.
  #
  # The same sweep says the other three seats stand. minimax is the field's
  # largest marginal contributor (+6 seeds over claude+codex) despite ranking
  # 10th of 19 on score, which is the whole reason a panel is not a leaderboard;
  # codex finds one seed nobody else in 19 models found. The only candidate that
  # would widen coverage further is qwen/qwen3.8-max (+3, to 89/100), and it is
  # not seated because it doubles the round's wall clock -- 1877s against the
  # 941s codex sets today -- and a round runs at its slowest reviewer's pace.
  #
  # kimi REPLACED BY minimax 2026-08-14, and the reason is worth keeping because
  # the bench did not predict it. kimi held its seat on 19/20 of those seeds with zero
  # unseeded findings; then two live rounds over this repository (runs
  # 20260813-180828 and 20260813-222753) had the judge drop 76% and then 85% of
  # what it reported -- 13 of 17, then 22 of 26 -- while it produced the largest
  # finding count on the panel. Rejected findings are not free: each one costs a
  # session, a prompt, and a share of the judge's context to throw away. Recall
  # against planted defects turned out not to predict precision against a real
  # codebase, which is the single most useful thing the panel has learned about
  # its own benchmark (seed counts below are the 20-seed bench, retired
  # 2026-08-20). minimax-m3 takes the seat on a perfect 20/20 across both
  # suites -- see minimax-ollama.yaml for what it costs and the one number that
  # argues against it.
  #
  # glm-5.2 remains the standing alternative if the ollama seat underperforms live
  # (20/20 with zero extras, glm-ollama.yaml).
  #
  # THE QUOTA RULE IS NOT DEAD. I declared it dead on 2026-09-01, reading the
  # per-token pricing announcement as having replaced the plan's limits.
  # Corrected 2026-09-02 from the account's own usage page: ollama publishes
  # per-token rates AND still meters a session limit (3h reset) and a weekly
  # limit (4d reset). Paid "Extra usage" is a separate prepaid balance that
  # starts at $0, so nothing overflows into money unless someone tops it up.
  #
  # So the instruction to drop the ollama seat when the limit is spent still has
  # its trigger, and it fired on 2026-09-02: a kimi-k3 bench sweep took the
  # session quota to 100% with 3 hours to reset.
  #
  # What the rates DID buy is a comparison the token counts hid: a full 8-target
  # sweep is $0.78 notional for glm-5.3-flash against $7.31 for glm-5.3, a 9.4x
  # spread at near-identical token counts. Rates live in bench/report.py as
  # OLLAMA_RATES -- and read them as notional, not as an invoice.
  #
  # Cost there is also per REQUEST, not just per token: 104 kimi-k3 requests ate
  # a whole session quota while 579 minimax-m3 requests were a thin slice of the
  # week. kimi-k3's page warns it "consumes extra usage credits"; believe it.
  #
  # What SURVIVES from that rule and still matters: a dead ollama agent burns its
  # full 30m timeout and can flip quorum to INCONCLUSIVE. That is about the
  # timeout and quorum arithmetic, not about quota, so it is unaffected -- if an
  # agent cannot answer, the panel must be smaller rather than waiting.
  #
  # BOTH OLLAMA SEATS PULLED 2026-08-21, on that rule: the weekly Ollama Cloud
  # limit was running out, a dead ollama agent writes nothing for its full 30m
  # timeout, and quorum counts only agents whose every lens succeeded -- so 2 dead
  # seats out of 4 land the verdict on INCONCLUSIVE no matter what claude and codex
  # found. A quota measure, not a verdict on either model; the measured seats stand.
  #
  # deepseek-ollama RESTORED 2026-08-24 after the weekly reset, then SWAPPED FOR
  # minimax-ollama the same day, on the first live measurement either seat has of
  # its MARGINAL yield -- which is the only thing a panel seat is bought with.
  # Two review-code runs over www.saiko.cz.flek (.fixpoint/20260824-094108 and
  # -115231) gave deepseek 17 observations; 6 survived, and every one of those 6
  # was also reported by claude or codex. All 12 it reported alone were rejected.
  # Unique surviving findings: ZERO. claude's were 10 and 12 in the same two runs,
  # codex's 5 and 2. The rejections were not hallucinations -- almost all read
  # "duplicate of iN, stated with less precision" -- which is the point: a seat
  # that restates what the panel already has adds nothing to buy.
  #
  # The bench agrees once it is asked about the PANEL instead of the model. Over
  # claude+codex+deepseek, minimax adds 4 seeds (C26, S05, D14, D24); over
  # claude+codex+minimax, deepseek adds 1 (D12). deepseek is the better reviewer
  # alone (66/100 to minimax's 57) and the smaller contributor to this panel --
  # the same reason a panel is not a leaderboard, one paragraph up. bench/ does
  # not compute this; recompute it from the per-seed tables in bench/results/.
  #
  # THE NUMBERS IN THIS PARAGRAPH ARE ON THE RETIRED 100-POINT SCALE. The
  # 2026-09-01 retire/replace moved the bench to 90 points, and neither model
  # here has been re-measured on it -- their summaries were already gone, so the
  # rows live in bench/results-archive-2026-08-20.csv and the per-seed tables in
  # the directory beside it, NOT in bench/results/. The seat reasoning stands;
  # the scores it quotes are not comparable to a current row.
  #
  # ONE ollama seat, not two, deliberately. Quorum is a strict majority, so a
  # 4-seat panel requires 3: seating both rather than swapping holds the tolerance
  # at one dead agent while doubling the seats that can die. deepseek has a failure
  # mode that has now fired three times (20260806-102122, 20260813-003817, and
  # review-bugs in 20260824-115231): one turn overruns the route's own 32000-token
  # output ceiling and the entire lens is lost, here after 13 minutes and 992k
  # input tokens. It is not a knob to raise -- 32000 is what this model reports as
  # modelUsage.maxOutputTokens -- and it cost the quorum note in that run.
  #
  # What this swap does NOT have is a live round for minimax. Its 2026-08-14
  # probation was never tested; the quota pull came first, and no summary in
  # .fixpoint/ carries it as a reviewer. So the metric that cost kimi its seat is
  # unmeasured here and THIS round is the test -- if the judge drops most of what
  # minimax says, glm-5.2 is the standing alternative and deepseek is one line
  # away. The one number that argued against minimax did not survive the finer
  # instrument: it reported the most unseeded findings of any ollama model on the
  # 20-seed bench, and on the 100-seed bench it reads extras 1 on code, 0 on
  # design -- the same as deepseek, glm and kimi, against claude's 3 and 4.
  #
  # Restore deepseek by putting the line back to [claude, codex, deepseek-ollama],
  # or seat both at [claude, codex, deepseek-ollama, minimax-ollama] for 86/100
  # once the weekly quota has room for two ollama agents and quorum 3.
  review:
    agents: [claude, codex, minimax-ollama]

loop:
  max_iterations: 5 # safety cap on review->fix rounds

  # How many times the actionable half of the CLOSING round may repeat. The phase
  # ends on its own the moment a pass finds nothing or fixes nothing, so this only
  # catches a lens that never runs out of things to say -- and review-tests is that
  # lens: coverage can always be wanted more of.
  #
  # 1, lowered from 2 on measurement. The argument for a second pass was "confirm the
  # first did not open something new", and a seven-round run showed what it actually
  # did: of pass 2's 7 findings, 4 critiqued the tests pass 1 had just written, 2
  # repeated what pass 1 already said, and 1 was a real regression -- introduced by
  # pass 1's own fix. Repairing the previous pass is not convergence, and the thing
  # that reliably catches a broken fix is the verify gate, which runs per fix.
  #
  # Raise it to 2 if your closing lenses are genuinely list-shaped (a fixed set of
  # coverage gaps to work through) rather than opinion-shaped; pair that with
  # final_skip_run_edits below, which is what keeps pass 2 off pass 1's own output.
  max_final_passes: 1

  # Files THIS RUN wrote that the CLOSING round must not be shown, as globs matched
  # against the paths the run's own commits changed. Empty means show everything,
  # which is what every version before this did.
  #
  # Empty HERE on purpose: the pattern is per-language, so a shipped default would
  # be wrong everywhere it is not Go -- the same reason verify.commands is empty.
  # The GATE supplies it: gates/go.yaml's skip_run_edits is where the fix configs
  # get "**/*_test.go" from (see config/README.md, "The verify gate").
  #
  # This is NOT a general "do not review your own work" rule. Inside the loop that
  # review is productive: it is how a fix's own bug gets caught, and a measured run's
  # single high-severity closing finding was exactly that. It is aimed at one
  # feedback loop that does not converge: review-tests asks for a test, the coder
  # writes one, and the next look reviews THAT TEST -- "the assertion claims more
  # than it proves", "the timing is wall-clock noise", "only one branch is
  # exercised". Seven of one run's 14 closing findings were that, every one against a
  # test file the run had committed minutes earlier.
  #
  # Hiding everything the run touched was measured and rejected: that run changed 27
  # of 57 source files, so the blunt rule blinds the closing round to half the tree,
  # including the newest code -- the code most worth a coverage review.
  final_skip_run_edits: []

  # ISSUES handed to the coder per round; 0 = unlimited, and unlimited is now the
  # default because the reason for a cap is gone. It was sized to ONE coder
  # session's timeout (17 issues blew 30m, ~8 fit), and the coder now gets exactly
  # one issue per session -- see commit_policy -- so no number of findings can
  # overrun a session.
  #
  # It was never free: a cap of 8 once deferred 18 issues across a run, and in the
  # closing round -- where no later round follows -- it dropped 5 coverage gaps
  # outright. Set it only as a cost lever, to bound what one round spends, knowing
  # the overflow waits (worst severity first, and every deferral promotes an issue
  # one tier so the tail cannot be starved by a lens that always has more to say).
  max_findings_per_round: 0

  # Consecutive zero-issue rounds required to stop. 2 pairs with
  # strategy: rotate — a differently-assigned panel must confirm the clean result.
  clean_rounds_to_stop: 2

  # There are deliberately NO trust keys here. Fix rounds are authorized only by
  # -trusted-target / -allow-untrusted-fix on the command line, and fixpoint
  # refuses to load a config that sets either: this file may itself come from the
  # repository under review (<project>/config is searched first), and code being
  # reviewed must not be able to declare itself trustworthy.

  # Commit header. {issue} {title} name a single fix; {round} {fixed} {rejected}
  # describe a round, for the squashing policies below. The body is built from the
  # coder's own report. A template mentioning {issue}/{title} is per-fix shaped, so
  # squashed commits fall back to a round-shaped header rather than naming one issue
  # for a commit holding many.
  commit_message: "fixpoint: {issue} — {title}"

  # How the round's commits are grouped. Every fix is made in its own coder session
  # and committed on its own -- one issue per session is what lets the verify gate
  # name the fix that broke the build, and what makes a fix revertable alone -- and
  # this only decides how those commits are then regrouped:
  #
  #   per_fix    keep them; one commit per issue, each with its own verify (the
  #              default: it is the granularity the work actually happened at, and
  #              the only one where `git revert` can undo a single bad fix)
  #   per_round  squash each round into one commit
  #   per_run    squash the entire run into one commit
  #
  # Squashing is `reset --soft`, so the content is byte-for-byte what was already
  # verified one fix at a time.
  commit_policy: per_fix

# Ping every agent with a trivial prompt before the run, in parallel, so an
# expired login fails before tokens are spent or git is touched.
ping_agents: true

verify:
  # The deterministic gate: commands FIXPOINT runs itself after the coder and
  # before the round commit, so "fixed" and "converged" mean more than "a model
  # said so". A round whose edits fail the gate is not committed -- the coder gets
  # one correction attempt, then the round is discarded and its edits stashed.
  #
  # No commands here on purpose: they are per-project (go build, npm test, cargo
  # check, ...), so a shipped default cannot know them, and an empty list disables
  # verification. Name a gate, or define them in your project's own task config.
  #
  # gate: the language's toolchain, as a FILE under <bundle>/gates/ that supplies
  #   `commands` and loop.final_skip_run_edits together. Shipped: go, rust, node,
  #   java, python, dotnet, cpp; the fix-* configs name `go`. Mutually exclusive
  #   with `commands` (both set is refused). `-gate <name>` on the command line
  #   replaces whichever the config chose, so one flag points fix-branch at a Node
  #   tree. `-check` prints the file it resolved to.
  #
  # Each command is `{name, run, optional, infra}`. `optional` records a result
  # without ever failing the round. `infra` says the command reaches something
  # the project does not control -- a registry, a proxy, a package index -- so a
  # failure is a fact about the ENVIRONMENT rather than a verdict on the code:
  # in an implement run it costs no attempt, writes no outcome marker, and is
  # retried with backoff like a provider refusal instead of permanently failing
  # the task and skipping everything that depends on it. Opt-in, because no exit
  # code distinguishes a network failure from a real one -- only the person who
  # wrote the command knows what it reaches. `npm ci` in config/implement-node.yaml
  # is the shipped example.
  #
  # policy:
  #   no_regressions  a check already failing before this run may keep failing,
  #                   but one that passed must not start failing. The default,
  #                   because a real repository may well start red.
  #   must_pass       every required check must pass, baseline or not.
  #   off             run nothing.
  #
  # SECURITY: these commands execute code from the target project, so they run
  # only on the fix path, which already requires an explicit trust assertion.
  policy: no_regressions
  timeout: 10m
  commands: []

logs:
  # Path template, resolved against the project root.
  #   {timestamp}  the RUN's start time — one value for the whole run
  #   {round}      the loop iteration
  # The literal prefix is what round commits and collection exclude, so it must
  # be non-empty. It is hidden and tool-owned because fixpoint runs against
  # projects it does not own: a generic name like "logs" would collide with a
  # project's real logs directory and silently drop it from review.
  # The {timestamp} segment and its ancestors hold the summary and the run journal
  # (journal.jsonl, one JSON state transition per line, flushed as it happens);
  # below it is per-round. Add .fixpoint/ to the project's .gitignore.
  dir: .fixpoint/{timestamp}/round-{round}

  # md | json | raw. Artifacts can contain secrets even after redaction — see
  # README.md. Owner-only permissions and keeping this directory out of any
  # commit or backup are the real controls.
  formats: [md, json, raw]

  # Per-step filename inside the round directory.
  #   {role} {agent} {prompt} {round} {timestamp} {ext}
  pattern: "{role}-{agent}-{prompt}-{timestamp}.{ext}"
  summary_pattern: "summary-{timestamp}.{ext}"
  timestamp_format: "20060102-150405" # Go layout (ref: Mon Jan 2 15:04:05 2006)

  # Extra Go regular expressions masked in every artifact and log line, on top of
  # the built-in credential shapes (sk-ant-…, ghp_…, JWTs, key/secret/password
  # assignments, PEM blocks, connection-string passwords). The built-ins recognize
  # shapes, so a site's own opaque token matches none of them and is written
  # verbatim — name yours here. A capture group is kept and the rest of the match
  # is masked, so the line stays readable:
  #   redact:
  #     - '(?i)(x-internal-auth\s*:\s*)\S+'
  #     - 'ACME-[A-Z0-9]{24}'
  # A pattern matching the empty string is rejected at startup: it would match at
  # every position and mask the whole of every artifact.
  redact: []
