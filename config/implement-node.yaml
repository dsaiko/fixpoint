# Implement a reviewed design as a new Node project, one task per commit.
#
#   fixpoint implement-node -target DESIGN.md -out ~/src/newapp -trusted-target
#
# See implement-go.yaml for the shape; only the stack differs. npm ci keeps
# the lockfile honest, and package-lock.json is gate_generated: the gate may
# create or update it, and the commit keeps it -- deleting a lockfile from
# every commit is the exact failure the third category exists for.
description: Implement a reviewed design as a new Node project, one task per commit. Needs -trusted-target and -out.

extends: defaults

roles:
  planner: { agent: claude, prompt: implement-plan }
  coder: { agent: claude-coder, prompt: implement-task }

implement:
  gitignore_seed: ["node_modules/", "dist/"]
  gate_generated: ["package-lock.json"]

verify:
  policy: must_pass
  # Per command; see implement-go.yaml for why this number decides how many
  # tasks a run admits. Longer than go's because `npm ci` on a cold cache with
  # a real dependency tree genuinely takes minutes.
  timeout: 8m
  commands:
    # infra: this command reaches the registry, so its failure is a fact about
    # the network and not about the code. Without the flag a five-minute 503
    # burned both attempts, wrote a PERMANENT failed marker and skipped every
    # dependent task -- the design's own infrastructure/result split applied to
    # the agent's provider but not to the gate's (review run 20260813-222753).
    #
    # --ignore-scripts: the packages installed here are named by a model that
    # read an untrusted design, and an install script runs as the operator, on
    # the host, up to eighty times a run -- with nothing reviewing the code
    # until review-code afterwards. One typosquatted name would otherwise be
    # arbitrary execution, pinned into the delivered lockfile. The cost is real:
    # a package needing a native build (node-gyp) will fail the gate here. That
    # is the intended direction -- fail loudly rather than execute quietly --
    # and an operator who needs those scripts drops the flag knowingly.
    - name: install
      infra: true
      run: ["npm", "ci", "--ignore-scripts"]
    - name: build
      run: ["npm", "run", "build", "--if-present"]
    - name: test
      run: ["npm", "test", "--if-present"]
