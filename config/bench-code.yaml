# Reviewer benchmark, code task: ONE candidate model reviews the frozen,
# seeded Go target in bench/testdata/target-go. Scored deterministically by
# bench/score.py against bench/manifest-go.yaml -- no judge and no
# refutation on purpose, so the run measures the candidate and nothing else.
# Methodology and decision rule: bench/README.md. Run via `make bench`.
description: Benchmark one candidate reviewer against the seeded code target.

extends: defaults

target:
  # The default excludes drop **/testdata/** so real runs never trip over the
  # seeded bugs; the bench targets that directory itself, so re-include it.
  exclude: []

roles:
  review:
    # bench-candidate.yaml is generated by bench/run.sh from
    # bench/agent-template.yaml; it does not exist in the repository.
    agents: [bench-candidate]
    strategy: all
    prompts:
      # Three lenses for 60 seeds: correctness and concurrency as before, plus
      # security, which owns 14 of them (auth.go, the traversal and the header
      # trust in main.go). Without the third lens those seeds would be
      # unreachable in practice -- the bugs lens does not go looking for an
      # unsalted hash -- and an unreachable seed measures nothing.
      - review-bugs
      - review-concurrency
      - review-security

loop:
  review_only: true
