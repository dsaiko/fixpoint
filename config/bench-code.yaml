# Reviewer benchmark, code task: ONE candidate model reviews the frozen,
# seeded Go target in bench/testdata/target-code. Scored deterministically by
# bench/score.py against bench/manifest-code.yaml -- no judge and no
# refutation on purpose, so the run measures the candidate and nothing else.
# Methodology and decision rule: bench/README.md. Run via `make bench`.
description: Benchmark one candidate reviewer against the seeded code target.

extends: defaults

target:
  # The default excludes drop **/testdata/** so real runs never trip over the
  # seeded bugs; the bench targets that directory itself, so re-include it.
  exclude: []

roles:
  review:
    # bench-candidate.yaml is generated by bench/run.sh from
    # bench/agent-template.yaml; it does not exist in the repository.
    agents: [bench-candidate]
    strategy: all
    prompts:
      - review-bugs
      - review-concurrency

loop:
  review_only: true
