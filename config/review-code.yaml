# One review round over a whole project's code, no edits. The safe starting
# point: the coder is never invoked, so nothing is modified and no fix-round trust
# gate applies. (Running a bundle the reviewed project itself ships still needs
# -trusted-target -- those files supply the commands fixpoint executes and the
# prompts it sends.) Same lens panel as fix-code, so it also previews what fix-code
# would be handed.
description: Review a whole project once, no edits (-trusted-target if it ships its own bundle).

extends: defaults

roles:
  # Still required even though it never runs: validation checks the whole
  # configuration up front rather than leaving a review-only run half-checked.
  coder: { agent: claude-coder, prompt: fix }
  review:
    # all: every lens on every reviewer, rather than rotate's one lens per
    # reviewer per round. A review run has ONE round -- nothing follows to catch
    # what a single model missed -- so breadth is the whole budget, and this is the
    # same argument that already makes an unpinned `final` lens fan out to the
    # panel. Cost is pool-size x lenses, which for a one-shot review is affordable
    # in a way it is not for a five-round fix loop.
    strategy: all
    prompts:
      - review-bugs
      - review-security
      - review-concurrency
      # The same panel as fix-code, modifiers included -- see the reasoning there.
      # A review-only run has no closing round (there is no coder to hand findings
      # to), so a final lens simply runs in this one round, which is what keeps this
      # config a complete preview of its fix sibling rather than a subset of it.
      - { prompt: review-tests, final: true }
      # No advisory lenses; see fix-code.yaml for why they were removed.

loop:
  review_only: true
