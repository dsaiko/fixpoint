# One review round over a whole project's code, no edits. The safe starting
# point: the coder is never invoked, so nothing is modified and no trust gate is
# needed. Same lens panel as fix-code, so it also previews what fix-code would
# be handed.
description: Review a whole project once, no edits. The safe starting point.

extends: defaults

roles:
  # Still required even though it never runs: validation checks the whole
  # configuration up front rather than leaving a review-only run half-checked.
  coder: { agent: claude-coder, prompt: fix }
  review:
    strategy: rotate
    agents: [codex, claude, gemma4, glm]
    prompts:
      - review-bugs
      - review-security
      - review-concurrency
      - review-tests
      - { prompt: review-maintainability, advisory: true }
      - { agent: claude, prompt: review-design, advisory: true, once: true }

loop:
  review_only: true
