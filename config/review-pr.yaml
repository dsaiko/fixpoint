# Review a GitHub pull request. The PR branch is checked out locally (gh pr
# checkout) and reviewed against its base.
#
# loop.review_only is true and must stay true unless you trust the PR author: a PR is
# externally authored code, and its content flows through reviewer findings into
# the coder, which edits files with permission checks disabled. Enabling fixes
# needs -allow-untrusted-fix, deliberately, per invocation.
description: Review a GitHub pull request; review-only by default.

extends: defaults

target:
  mode: pr
  pr: 0 # placeholder: pass -pr <number> on the command line, or edit here

roles:
  coder: { agent: claude-coder, prompt: fix }
  review:
    # all: every lens on every reviewer, rather than rotate's one lens per
    # reviewer per round. A review run has ONE round -- nothing follows to catch
    # what a single model missed -- so breadth is the whole budget, and this is the
    # same argument that already makes an unpinned `final` lens fan out to the
    # panel. Cost is pool-size x lenses, which for a one-shot review is affordable
    # in a way it is not for a five-round fix loop.
    strategy: all
    agents: [codex, claude]
    prompts:
      - review-bugs
      - review-security
      - review-concurrency
      - review-tests

loop:
  review_only: true
  max_iterations: 1

# The refutation round: after the panel reports, every reviewer is shown the MERGED
# finding set and must take an evidenced position on each one. What all of them
# refute is dropped; what any of them still stands behind is kept and marked
# contested.
#
# It replaces the obvious alternative -- keep only what two reviewers both found --
# which measurement ruled out: across 19 runs under 4% of findings were reported by
# more than one reviewer, and NONE of the 25 the coder rejected as false positives
# were among them. An intersection would have filtered none of the noise while
# discarding 237 of 248 confirmed defects.
review:
  refute: refute
