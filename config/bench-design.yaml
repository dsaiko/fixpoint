# Reviewer benchmark, design task: ONE candidate model reviews the frozen,
# seeded design document in bench/testdata/target-design. Scored
# deterministically by bench/score.py against bench/manifest-design.yaml -- no
# judge and no refutation on purpose, so the run measures the candidate and
# nothing else.
# Methodology and decision rule: bench/README.md. Run via `make bench`.
description: Benchmark one candidate reviewer against the seeded design target.

extends: defaults

roles:
  review:
    agents: [bench-candidate]
    strategy: all
    prompts:
      # Two lenses for 40 seeds: D01-D24 are failure and operation, D25-D40 are
      # data-model decisions, and the failure lens is explicitly told not to
      # judge data. One lens could only ever reach half the seeds.
      - design-failure
      - design-data

# Every lens runs inside bench/sandbox.sh, which hides the repository checkout (the
# answer key, the scorer, every earlier model's findings) and ~/.fixpoint from it,
# lets it write only a scratch directory of its own, and gives its CLI only the
# state it needs (a fresh one for codex). What it does NOT stop (the rest of $HOME on macOS, the network, claude's
# .claude.json) is listed in bench/README.md. The wrapper name is BARE on purpose:
# fixpoint runs an agent with its working directory in the target, so a relative
# path would resolve against the staged copy, and the config cannot name the
# checkout absolutely. bench/run.sh puts bench/ on PATH; run this config by hand the
# same way:
#   PATH=$PWD/bench:$PATH ./fixpoint bench-design -check --agents-sandboxed ...
# (the flag is what lets a codex candidate run with its own sandbox off, which
# cannot nest inside the wrapper).
sandbox:
  command: [sandbox.sh, "{{target}}", "{{target_mode}}", --]

loop:
  review_only: true
