# Reviewer benchmark, design task: ONE candidate model reviews the frozen,
# seeded design document in bench/testdata/target-design. Scored
# deterministically by bench/score.py against bench/manifest-design.yaml -- no
# judge and no refutation on purpose, so the run measures the candidate and
# nothing else.
# Methodology and decision rule: bench/README.md. Run via `make bench`.
description: Benchmark one candidate reviewer against the seeded design target.

extends: defaults

roles:
  review:
    agents: [bench-candidate]
    strategy: all
    prompts:
      # Two lenses for 40 seeds: D01-D24 are failure and operation, D25-D40 are
      # data-model decisions, and the failure lens is explicitly told not to
      # judge data. One lens could only ever reach half the seeds.
      - design-failure
      - design-data

# Every lens runs inside bench/sandbox.sh: it cannot read the repository checkout
# (the answer key, the scorer, every earlier model's findings) or ~/.fixpoint, and
# it can write nowhere but its own CLI's state and scratch. The name is BARE on
# purpose: fixpoint runs an agent with its working directory in the target, so a
# relative path would resolve against the staged copy, and the config cannot name
# the checkout absolutely. bench/run.sh puts bench/ on PATH; run this config by hand
# the same way (PATH=$PWD/bench:$PATH ./fixpoint bench-code -check). What the wrapper
# does and does not enforce: bench/sandbox.sh, bench/README.md.
sandbox:
  command: [sandbox.sh, "{{target}}", "{{target_mode}}", --]

loop:
  review_only: true
