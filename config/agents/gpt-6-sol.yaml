# GPT-6 Sol as a BENCH CANDIDATE, through the codex harness -- the same file as
# config/agents/codex.yaml with only the model and effort lines swapped, so the
# comparison against the codex baseline (gpt-5.6-sol) has one variable. Not a
# seat: nothing references this file except `make bench MODEL=gpt-6-sol`.
#
# This is the SUCCESSOR of the model that holds the panel's ChatGPT seat, which
# makes it the codex-route twin of the claude-opus-5-5 question -- and the same
# rare shape: a candidate that can take a seat without touching the payer map,
# because a swap WITHIN the seat is structurally free. astra and terra could
# only ever have replaced codex too, and both lost on the numbers.
#
# IT IS CHEAPER THAN THE MODEL IT SUCCEEDS, and by more than Opus 5.5 was:
#   gpt-5.6-sol  $5.00 in  $30.00 out  $0.50 cached   (list; see report.py)
#   gpt-6-sol    $2.00 in  $10.00 out  $0.20 cached   (-60% / -67% / -60%)
# Two independent sources on 2026-09-22 agree on $2/$0.20/$10 and both call it
# PERMANENT rather than promotional -- which matters, because the gpt-5.6-sol
# row it is measured against deliberately carries LIST price while OpenAI is
# discounting that model to $4/$20 "at least through November 21, 2026".
# Requests over 272K input tokens are surcharged 2x in / 1.5x out; no bench
# session comes close, so the plain rate is the right one here.
#
# Reachable on ChatGPT-account auth: ~/.codex/models_cache.json (2026-09-22)
# lists it and the probe below answered on the first try. Its DEFAULT effort is
# `medium` (astra's is `low`), so the effort line below is load-bearing -- without
# it this row would differ from the baseline in effort as well as model.
#   printf x | codex exec --sandbox read-only --skip-git-repo-check --json \
#     --model gpt-6-sol -
#
# Read its token columns through the cached-input caveat in bench/models.txt:
# codex reports OpenAI's usage shape, where input_tokens INCLUDES the cached
# subset. report.py has handled that since 2026-09-07; a hand calculation from
# these numbers must not double-count it.
model: gpt-6-sol
effort: high # low | medium | high | xhigh
command:
  - codex
  - exec
  - --sandbox read-only # reviewer duty: enforced no-write sandbox
  - --skip-git-repo-check # allow running in non-git target dirs
  - --color never # keep raw logs clean
  - --json # JSONL event stream: carries the turn's token usage
  - --model {{model}}
  - -c model_reasoning_effort={{effort}}
  - "-" # read the prompt from stdin, keeping it off argv (ps / /proc)

# codex streams one JSON object per line, so the LAST value of each path wins: the
# reply arrives on an item.completed line and the totals on turn.completed.
#
# No cost_usd: codex reports tokens but no price, because ChatGPT-account auth has
# no per-request cost to report. The scoreboard leaves its cost blank rather than
# inventing one from a published rate card -- see config.AgentUsage.
usage:
  format: jsonl
  text: item.text
  input_tokens: usage.input_tokens
  output_tokens: usage.output_tokens
  cache_read_tokens: usage.cached_input_tokens
  cache_write_tokens: usage.cache_write_input_tokens
prompt_via: stdin
# 30m: see claude.yaml. This agent was killed at 10m having emitted 1 MB of
# exploration output and still working -- unlike a hung process, it was making
# progress the whole time.
timeout: 30m
can_edit: false
# To use codex as the coder, copy this to codex-coder.yaml with
# --dangerously-bypass-approvals-and-sandbox instead of --sandbox read-only,
# and can_edit: true.

# Only these variables reach the agent, on top of a non-secret baseline (PATH,
# HOME, locale, TLS trust, proxy settings). Everything else in fixpoint's
# environment -- your GitHub token, cloud credentials, database passwords -- is
# absent from the process, so a prompt-injected reviewer cannot quote what it
# cannot see. See config/README.md.
env:
  pass:
  # codex reads ~/.codex when logged in; these cover API-key auth.
    - OPENAI_API_KEY
    - CODEX_API_KEY

# Same ceiling as claude.yaml; measured maximum on this project is 314 kB.
prompt_budget: 900000
