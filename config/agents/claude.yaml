# Reviewer-duty claude: good quality/cost balance.
# Exact model id, not the `opus` alias -- see claude-coder.yaml.
model: claude-opus-5
effort: high # low | medium | high | xhigh | max
command:
  - claude
  - -p # no permission-skip flag: reads work, edit tools are denied
  - --model {{model}}
  - --effort {{effort}}
prompt_via: stdin
timeout: 10m
can_edit: false
