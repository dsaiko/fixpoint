# Beam via Ollama Cloud DIRECTLY: the codex harness talking to https://ollama.com
# with OLLAMA_API_KEY, no local ollama install and no local server in the path.
# ON THE PANEL since 2026-10-28, in the ollama seat -- replacing
# beam-ollama-codex.yaml, which is the same model and harness reached through
# `ollama launch codex` and the local server on 127.0.0.1:11434, and stays in the
# bundle one word away.
#
# THE ROUTE COSTS NOTHING, measured the same day on both routes (codex harness,
# same effort), with claude-sonnet + gpt-6-sol as the rest of the panel:
#
#                              direct     launch
#   glm-5.3-flash#max, 8 tgts  295 / 408  305 / 406   (solo / panel, of 484)
#     wall clock, tokens       4502s 7.3M 4619s 8.6M
#     restates                 2          1           (all recovered)
#   beam, rust+ts+cpp          110        109         (solo)
#
# Per-target swings run both ways (-12 to +8) and are the usual noise. Beam lost
# replies on BOTH routes that day: a lens writes its review, codex receives only
# "Done." or "the block is provided above", and the restate returns no findings.
# That is the model or ollama's cloud, not this transport.
#
# Why it exists (2026-10-28): the local server is a moving part with its own
# failure mode -- it is not restarted by a binary upgrade, and a stale one was
# measured to cache far worse (it was stale again on the day this file was
# written: server 0.40.6, client 0.40.11). It is also an install on every host
# that runs the panel. ollama.com serves the same protocols itself, probed that
# day with the account's key: /v1/responses, /v1/messages, /v1/chat/completions
# and /api/chat all answer, and accept the `beam:cloud` tag as well as `beam`.
#
# WHAT `ollama launch codex` DID THAT THIS FILE HAS TO DO ITSELF:
#   provider    the -c model_providers.* block below, keyed by env_key.
#   metadata    launch writes ~/.codex/model.json, a catalog giving beam empty
#               base_instructions, verbosity low, a 1048576 context window and a
#               10000-token truncation_policy. Without it codex warns "Model
#               metadata for `beam:cloud` not found" and falls back to metadata
#               that sends beam CODEX'S OWN GPT system prompt, ~3.5k tokens a turn.
#               That is not cosmetic: the first bench pass ran on the fallback and
#               scored go 26/56 against the launch route's 40 and 38, with the
#               bugs lens spending 3.06M input tokens over 41 reasoning steps and
#               ending on "Done." with no review block. Those rows are in
#               results.csv as beam-ollama-direct-fallback.
#               The catalog is a path, and a command has no placeholder for the
#               bundle's directory, so its values are set as keys instead. Checked
#               against the catalog by capturing both request bodies: the same
#               instructions, verbosity and tools, except the model list
#               multi_agent_v1 advertises for sub-agents (OpenAI models here,
#               ollama ones there). A 109k-character command output reached the
#               model as 105.5k input tokens here, 106.6k with the catalog, 113.6k
#               on the fallback. The warning stays: it arrives as an item of type
#               error, which text_when filters out.
#
# EFFORT IS LIVE on this route, as on the launch route. Probed on one prompt:
# low 606 output tokens, xhigh 2045.
#
# THE KEY MUST NOT REACH THE MODEL'S SHELL. codex hands its environment to the
# commands the model runs, and its default policy does not drop OLLAMA_API_KEY:
# probed, `env | grep -c OLLAMA_API_KEY` printed 1 inside the session without the
# exclude below and 0 with it. A reviewer reading the key is the env-quoting
# exfiltration config/README.md describes, through the one variable this file
# passes.
model: beam:cloud
effort: xhigh # the deepest level that reaches beam through codex; see beam-ollama-codex.yaml
command:
  - codex
  - exec
  - --ignore-user-config # no ~/.codex/config.toml: its MCP servers and plugins (Computer Use, browser) would reach a read-only reviewer
  - -c features.apps=false # nor the ChatGPT login's apps (Sites deploy, Spaces sharing), which do not come from that file
  - -c model_provider=ollama-cloud
  - -c model_providers.ollama-cloud.name=ollama-cloud
  - -c model_providers.ollama-cloud.base_url=https://ollama.com/v1
  - -c model_providers.ollama-cloud.wire_api=responses
  - -c model_providers.ollama-cloud.env_key=OLLAMA_API_KEY
  - -c shell_environment_policy.exclude=["OLLAMA_API_KEY"] # see above
  - -c instructions="" # the launch catalog's empty base_instructions, not codex's GPT prompt
  - -c model_verbosity=low # the launch catalog's default_verbosity
  - -c model_context_window=1048576 # the launch catalog's context_window
  - -c tool_output_token_limit=10000 # the launch catalog's truncation_policy
  - --model {{model}}
  - --sandbox read-only # reviewer duty: enforced no-write sandbox
  - --skip-git-repo-check # allow running in non-git target dirs
  - --color never # keep raw logs clean
  - --json # JSONL event stream: carries the turn's token usage
  - -c model_reasoning_effort={{effort}}
  - "-" # read the prompt from stdin, keeping it off argv (ps / /proc)

# The same JSONL envelope as beam-ollama-codex.yaml.
#
# NO cost_usd, for beam-ollama.yaml's reason: nothing bills this per token at a
# rate anyone published.
usage:
  format: jsonl
  text: item.text
  text_when: item.type=agent_message # the answer, not a reasoning note or the metadata warning
  input_tokens: usage.input_tokens
  output_tokens: usage.output_tokens
  cache_read_tokens: usage.cached_input_tokens
  cache_write_tokens: usage.cache_write_input_tokens
  error_text: error.message # turn.failed: the reason, not the last narration

prompt_via: stdin
timeout: 30m # cloud-served models are slower; matched to the panel (see claude-opus.yaml)
can_edit: false

# The provider block reads the key from here. OPENAI_API_KEY is deliberately not
# passed: codex must not be able to fall back to a first-party endpoint and bill
# the ChatGPT seat's account for this one.
env:
  pass:
    - OLLAMA_API_KEY

# 400 kB, matching the other ollama agents: the budget is per ROUTE, and this is
# the same backend.
prompt_budget: 400000
