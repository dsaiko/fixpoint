# DeepSeek via ollama, same claude-harness wrapping as minimax-ollama. ON THE
# PANEL since 2026-08-12; the seat moved from the FLASH tier to the PRO tier on
# 2026-08-20, and the reason is the whole argument for rebuilding the bench.
#
# Both tiers scored a perfect 20/20 on the old seeded bench -- indistinguishable,
# so the seat went to flash on the latency argument below. The 100-seed bench
# separates them: pro 66/100, flash 52/100 (bench/results.csv, runs
# 20260820-124306 and 20260820-122214), on the same route, the same quota, in
# comparable wall clock (576s vs 489s) and FEWER tokens (500k vs 593k). Nothing
# about the flash argument was wrong; there was simply no measurement fine
# enough to test it until now.
#
# WHAT THIS SWAP DOES NOT BUY: coverage. Against the rest of the panel (claude,
# codex, minimax) pro contributes the same 3 seeds flash did, and the panel still
# covers 86/100 either way -- the panel's product is what one reviewer finds and
# the others miss, and on that axis these two are interchangeable. The upgrade is
# in the individual reviewer, at no extra cost. Do not quote the 14-point gap as
# a coverage gain.
#
# Decided on ONE repeat, deliberately: the bench's own variance probe (the same
# model measured twice, 75 and 74) moved 1 point in total and +/-4 per task, so a
# 14-point gap is outside it, while the 57-vs-57 tie between minimax and
# kimi-k2.7 is not decidable without N=3.
#
# The pinned tag matters, and this file has already been bitten by it:
# `deepseek-v4-flash:cloud` and `deepseek-v4-flash:0731-cloud` are NOT the same
# model -- the floating tag reported 158B parameters, the dated one 304B. The
# bench measured `deepseek-v4-pro:cloud`, and on the day of the swap that tag
# fingerprinted identically to `0813-cloud` (1.65T parameters, FP8, 1M context,
# `ollama show`), so the dated tag below IS the measured model and cannot be
# re-pointed out from under it.
#
# Capabilities per `ollama show`: completion, tools. No vision, which is what
# disqualified the qwen3.7 flash and plus tiers -- those are vision-language
# models whose published strengths are object recognition, and a code reviewer
# reading source wants neither.
#
# The flash tier's original case -- that the panel's cost is driven by TURNS
# rather than tokens (kimi took ~168 turns to claude's ~37), so a fast tier that
# converges could beat a stronger one that will not -- is in git history at
# 881cf03. It held for eight days and lost to a finer instrument, which is the
# outcome that argument asked for.
model: deepseek-v4-pro:0813-cloud
command:
  - ollama
  - launch
  - claude
  - --model {{model}}
  - --
  - --output-format json # machine-readable envelope: carries usage + cost
  - -p # no permission-skip flag: reads work, edit tools are denied
  - --setting-sources user # target-supplied hooks/MCP/skills stay out; see claude.yaml
# The CLI reports what it actually spent; fixpoint reads it from here rather than
# estimating from the bytes it exchanged (which miss the whole agentic session in
# between -- see config/README.md). modelUsage is keyed by model id and aggregates
# the WHOLE session; the top-level `usage` object is only the final turn.
#
# NO cost_usd: ollama-served models are not billed by Anthropic, but the wrapped
# claude harness applies Anthropic's rate card anyway and labels them provider
# "firstParty" -- measured overstating a real bill by ~93x elsewhere. The
# scoreboard shows "-" rather than money nobody was charged. Tokens ARE real and
# still counted, and the cache_* paths will read 0 here: ollama discards
# cache_control, which is a property of the route, not of this model.
usage:
  format: json
  text: result
  input_tokens: modelUsage.*.inputTokens
  output_tokens: modelUsage.*.outputTokens
  cache_read_tokens: modelUsage.*.cacheReadInputTokens
  cache_write_tokens: modelUsage.*.cacheCreationInputTokens
  # Set when the API refused the call rather than the CLI failing (429, 5xx);
  # without it a provider refusal is indistinguishable from a broken agent.
  error_status: api_error_status

# No `effort`: ollama drops the thinking budget the harness translates it into.
# See "effort (claude)" in _README.md for the measurement.

prompt_via: stdin
timeout: 30m # cloud-served models are slower; matched to the panel (see claude.yaml)
can_edit: false

# Only these variables reach the agent, on top of a non-secret baseline (PATH,
# HOME, locale, TLS trust, proxy settings). Everything else in fixpoint's
# environment -- your GitHub token, cloud credentials, database passwords -- is
# absent from the process, so a prompt-injected reviewer cannot quote what it
# cannot see. See config/README.md.
env:
  pass:
  # ollama needs to find its server; the wrapped claude harness needs nothing more.
    - OLLAMA_HOST

# 400 kB, matching the other ollama agents: same route, same failure mode, measured maximum
# here 74 kB.
prompt_budget: 400000
