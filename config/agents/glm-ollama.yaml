# GLM via ollama, same claude-harness wrapping as kimi-ollama.
#
# NOT on the panel, and not a fallback for anything either: GLM was dropped from
# the review panel outright, on both routes. It was the weakest producer by a wide
# margin -- 1 issue for 10.5M tokens in one measured run, roughly 3.5x worse per
# token than anyone else, against kimi's 10 issues in the same run -- and cheaper
# tokens make a weak reviewer cheaper, not better.
#
# Kept only so the decision is reversible and the measurement has somewhere to
# live. Its 0% cache rate (12.6M fresh input across four sessions in one run) is a
# property of the ollama route, not of the model; see kimi-ollama.yaml for why that
# route is still the panel's choice for the agent that stayed.
model: glm-5.2:cloud
# No `effort`, deliberately: it is Anthropic's setting, and ollama drops the
# thinking budget the harness translates it into. Measured -- this model produced
# ~1487 thinking tokens under a 1024 budget, and ~1511 with no budget at all.
# Setting it would validate, run, and lie. See "effort (claude)" in _README.md.
command:
  - ollama
  - launch
  - claude
  - --model {{model}}
  - --
  - --output-format json # machine-readable envelope: carries usage + cost
  - -p # no permission-skip flag: reads work, edit tools are denied
  - --setting-sources user # target-supplied hooks/MCP/skills stay out; see claude.yaml
# The CLI reports what it actually spent; fixpoint reads it from here rather than
# estimating from the bytes it exchanged (which miss the whole agentic session in
# between -- see config/README.md). modelUsage is keyed by model id and aggregates
# the WHOLE session; the top-level `usage` object is only the final turn.
# NO cost_usd: kimi/glm are served by ollama, not Anthropic, and the wrapped
# claude harness has no idea what ollama charges -- it labels them provider
# "firstParty" and applies Anthropic's rate card. Measured on a real run: the cost
# it reported for these two matched Opus-5 published rates to a ratio of 1.000
# ($55.70 for glm's 10.5M input tokens), while the genuinely-Anthropic agents came
# in at 1.09-1.20 because their real billing includes cache-TTL tiers. That number
# is a rate-card calculation, not a bill, so it is not read: the scoreboard shows
# "-" for these agents rather than $70 of money nobody was charged. Tokens ARE
# real and still counted.
usage:
  format: json
  text: result
  input_tokens: modelUsage.*.inputTokens
  output_tokens: modelUsage.*.outputTokens
  cache_read_tokens: modelUsage.*.cacheReadInputTokens
  cache_write_tokens: modelUsage.*.cacheCreationInputTokens
  # Set when the API refused the call rather than the CLI failing (429, 5xx);
  # without it a provider refusal is indistinguishable from a broken agent.
  error_status: api_error_status

prompt_via: stdin
timeout: 30m # cloud-served models are slower; matched to the panel (see claude.yaml)
can_edit: false

# Only these variables reach the agent, on top of a non-secret baseline (PATH,
# HOME, locale, TLS trust, proxy settings). Everything else in fixpoint's
# environment -- your GitHub token, cloud credentials, database passwords -- is
# absent from the process, so a prompt-injected reviewer cannot quote what it
# cannot see. See config/README.md.
env:
  pass:
  # See kimi-ollama.yaml.
    - OLLAMA_HOST

# 400 kB, matching the other ollama-served agents: same route, same failure mode.
prompt_budget: 400000
