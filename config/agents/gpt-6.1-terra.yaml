# GPT-6.1 Terra as a BENCH CANDIDATE, through the codex harness -- the same file
# as config/agents/gpt-6.1-sol.yaml with only the model swapped, so the
# comparison against its sibling (and against the seated gpt-6-sol) has one
# variable. Not a seat: nothing references this file except
# `make bench MODEL=gpt-6.1-terra`.
#
# Released 2026-10-26/27, the middle rung of the gpt-6.1 family and the
# successor of gpt-5.6-terra (221/484 here). Third-party rate cards on
# 2026-10-29 agree on $1/M in, $0.05/M cached, $5/M out -- half of gpt-6.1-sol
# -- with no OpenAI page among the sources.
#
# Reachable on ChatGPT-account auth with codex-cli 0.165.0: the probe below
# answered on 2026-10-29. ~/.codex/models_cache.json lists efforts
# low|medium|high|xhigh|max|ultra and a DEFAULT of `low`, so the effort line is
# load-bearing: every ChatGPT-route row in the grid runs at `high`.
#   printf x | codex exec --sandbox read-only --skip-git-repo-check --json \
#     --model gpt-6.1-terra -c model_reasoning_effort=high -
model: gpt-6.1-terra
effort: high # low | medium | high | xhigh
command:
  - codex
  - exec
  - --ignore-user-config # no ~/.codex/config.toml: its MCP servers and plugins (Computer Use, browser) would reach a read-only reviewer
  - -c features.apps=false # nor the ChatGPT login's apps (Sites deploy, Spaces sharing), which do not come from that file
  - --sandbox read-only # reviewer duty: enforced no-write sandbox
  - --skip-git-repo-check # allow running in non-git target dirs
  - --color never # keep raw logs clean
  - --json # JSONL event stream: carries the turn's token usage
  - --model {{model}}
  - -c model_reasoning_effort={{effort}}
  - "-" # read the prompt from stdin, keeping it off argv (ps / /proc)

# codex streams one JSON object per line, so the LAST value of each path wins: the
# reply arrives on an item.completed line and the totals on turn.completed.
#
# No cost_usd: codex reports tokens but no price, because ChatGPT-account auth has
# no per-request cost to report. The scoreboard leaves its cost blank rather than
# inventing one from a published rate card -- see config.AgentUsage.
usage:
  format: jsonl
  text: item.text
  text_when: item.type=agent_message # the answer, not a reasoning note: a turn that ends with no answer is an empty reply
  input_tokens: usage.input_tokens
  output_tokens: usage.output_tokens
  cache_read_tokens: usage.cached_input_tokens
  cache_write_tokens: usage.cache_write_input_tokens
  error_text: error.message # turn.failed: the reason, not the last narration
prompt_via: stdin
# 30m: see claude-opus.yaml. This agent was killed at 10m having emitted 1 MB of
# exploration output and still working -- unlike a hung process, it was making
# progress the whole time.
timeout: 30m
can_edit: false
# To use codex as the coder, copy this to codex-coder.yaml with
# --dangerously-bypass-approvals-and-sandbox instead of --sandbox read-only,
# and can_edit: true.

# Only these variables reach the agent, on top of a non-secret baseline (PATH,
# HOME, locale, TLS trust, proxy settings). Everything else in fixpoint's
# environment -- your GitHub token, cloud credentials, database passwords -- is
# absent from the process, so a prompt-injected reviewer cannot quote what it
# cannot see. See config/README.md.
env:
  pass:
  # codex reads ~/.codex when logged in; these cover API-key auth.
    - OPENAI_API_KEY
    - CODEX_API_KEY

# Same ceiling as claude-opus.yaml; measured maximum on this project is 314 kB.
prompt_budget: 900000
