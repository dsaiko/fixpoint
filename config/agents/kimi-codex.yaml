# Kimi via OpenRouter, driven by the CODEX harness rather than Claude Code's.
# Same model and same route as kimi-openrouter.yaml -- the harness is the only
# variable, which is the point: this file exists to be compared against that one.
#
# WHY. Caching was not the cost driver; turn count is. Measured on the same lens
# in one round, kimi through the claude harness against claude through its own:
#
#     agent             lens                turns   cache read
#     claude            review-security        37        3.69M
#     kimi-openrouter   review-concurrency    168       29.23M
#
# 4.5x the turns and 8x the tokens for comparable work, at 98% cache hit -- so the
# money went on re-reading a conversation that kept growing because the session
# would not converge. One such session cost ~$5. OpenRouter's own docs note that
# Claude Code is tuned for Anthropic models and others "may not work correctly",
# and 168 turns is what that looks like when it is true.
#
# Codex is the natural control: it supports third-party providers officially, and
# a model that loops under one harness may not under another. If turns land near
# claude's, the panel keeps kimi cheaply; if they do not, the model is the problem
# and no route or harness will fix it.
#
# The provider block is passed with -c rather than written into ~/.codex/config.toml
# so this file is self-contained -- an agent that only works on a machine someone
# hand-edited is not reproducible. wire_api MUST be "responses": codex 0.146
# dropped "chat", and OpenRouter does serve Responses (an earlier note in this
# bundle claimed otherwise; it was read off a probe with an expired key).
model: moonshotai/kimi-k2.7-code
command:
  - codex
  - exec
  - --sandbox read-only # reviewer duty: enforced no-write sandbox
  - --skip-git-repo-check # allow running in non-git target dirs
  - --color never # keep raw logs clean
  - --json # JSONL event stream: carries the turn's token usage
  - --model {{model}}
  - -c model_provider=openrouter
  - -c model_providers.openrouter.name="OpenRouter"
  - -c model_providers.openrouter.base_url="https://openrouter.ai/api/v1"
  - -c model_providers.openrouter.env_key="OPENROUTER_API_KEY"
  - -c model_providers.openrouter.wire_api="responses"
  - "-" # read the prompt from stdin, keeping it off argv (ps / /proc)

# No model_reasoning_effort, and so no `effort` field: OpenRouter's handling of a
# reasoning budget is not a usable dial -- a 1024 budget produced ~2327 thinking
# tokens from this model and a 6000 budget produced fewer. See _README.md.
#
# codex streams one JSON object per line, so the LAST value of each path wins: the
# reply arrives on an item.completed line and the totals on turn.completed.
#
# No cost_usd: codex reports tokens but no price. The real bill is on the
# OpenRouter account, and a rate card guessed here would be fiction -- the claude
# harness's own guess was measured overstating by ~93x. Tokens ARE real and
# counted, and for this agent the token count is the whole experiment.
usage:
  format: jsonl
  text: item.text
  input_tokens: usage.input_tokens
  output_tokens: usage.output_tokens
  cache_read_tokens: usage.cached_input_tokens
  cache_write_tokens: usage.cache_write_input_tokens
prompt_via: stdin
timeout: 20m # matched to the rest of the panel
can_edit: false

# Only these variables reach the agent, on top of a non-secret baseline (PATH,
# HOME, locale, TLS trust, proxy settings). Everything else in fixpoint's
# environment -- your GitHub token, cloud credentials, database passwords -- is
# absent from the process, so a prompt-injected reviewer cannot quote what it
# cannot see. See config/README.md.
env:
  pass:
  # Named by the provider block above: codex resolves env_key itself, so unlike
  # the claude route this one wants the key under its OWN name, not
  # ANTHROPIC_AUTH_TOKEN.
    - OPENROUTER_API_KEY
