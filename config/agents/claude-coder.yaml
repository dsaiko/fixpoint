# The coder: the only agent allowed to edit files.
#
# Pinned to an exact model id rather than the `opus` alias. That alias currently
# resolves to claude-opus-4-8 and re-points whenever the CLI ships a new alias
# table, which would silently change which model fixes your code mid-project.
model: claude-opus-5
effort: high # xhigh runs ~2x slower for marginal gain on typical findings
command:
  - claude
  - --output-format json # machine-readable envelope: carries usage + cost
  - -p
  - --dangerously-skip-permissions # required to edit; see can_edit below
  - --model {{model}}
  - --effort {{effort}}
# The CLI reports what it actually spent; fixpoint reads it from here rather than
# estimating from the bytes it exchanged (which miss the whole agentic session in
# between -- see config/README.md). modelUsage is keyed by model id and aggregates
# the WHOLE session; the top-level `usage` object is only the final turn.
usage:
  format: json
  text: result
  input_tokens: modelUsage.*.inputTokens
  output_tokens: modelUsage.*.outputTokens
  cache_read_tokens: modelUsage.*.cacheReadInputTokens
  cache_write_tokens: modelUsage.*.cacheCreationInputTokens
  cost_usd: modelUsage.*.costUSD
  # Set when the API refused the call rather than the CLI failing. This is the
  # agent that hit it: a run ended `coder failed: exit status 1` when the envelope
  # said 429 "You've hit your session limit · resets 8:20pm".
  error_status: api_error_status

prompt_via: stdin
timeout: 30m # fixing rounds run longer than a single review pass
can_edit: true
# No `--setting-sources user` here, unlike every reviewer -- deliberately. That
# flag exists on the reviewers because they run against material nobody vouched
# for, and a hook in the target's .claude/settings.json would be execution they
# never asked for. A fix round is the opposite case: it is refused outright
# unless the operator passes -trusted-target (or -allow-untrusted-fix in pr
# mode) on that very invocation, and this command already auto-approves every
# tool request above, so target-supplied settings are not an escalation over
# what was authorized. In exchange the coder keeps the target's own CLAUDE.md
# and project conventions, which is most of what makes its edits fit in.

# Only these variables reach the agent, on top of a non-secret baseline (PATH,
# HOME, locale, TLS trust, proxy settings). Everything else in fixpoint's
# environment -- your GitHub token, cloud credentials, database passwords -- is
# absent from the process, so a prompt-injected reviewer cannot quote what it
# cannot see. See config/README.md.
env:
  pass:
  # claude authenticates from ~/.claude when you have logged in, so this is only
  # needed if you use an API key instead. An unset name is simply not passed.
    - ANTHROPIC_API_KEY
