# The coder: the only agent allowed to edit files.
#
# Pinned to an exact model id rather than the `opus` alias. That alias currently
# resolves to claude-opus-4-8 and re-points whenever the CLI ships a new alias
# table, which would silently change which model fixes your code mid-project.
model: claude-opus-5
effort: high # xhigh runs ~2x slower for marginal gain on typical findings
command:
  - claude
  - -p
  - --dangerously-skip-permissions # required to edit; see can_edit below
  - --model {{model}}
  - --effort {{effort}}
prompt_via: stdin
timeout: 30m # fixing rounds run longer than a single review pass
can_edit: true

# Only these variables reach the agent, on top of a non-secret baseline (PATH,
# HOME, locale, TLS trust, proxy settings). Everything else in fixpoint's
# environment -- your GitHub token, cloud credentials, database passwords -- is
# absent from the process, so a prompt-injected reviewer cannot quote what it
# cannot see. See config/README.md.
env:
  pass:
  # claude authenticates from ~/.claude when you have logged in, so this is only
  # needed if you use an API key instead. An unset name is simply not passed.
    - ANTHROPIC_API_KEY
