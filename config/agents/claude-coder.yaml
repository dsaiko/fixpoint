# The coder: the only agent allowed to edit files.
#
# Pinned to an exact model id rather than the `opus` alias. That alias currently
# resolves to claude-opus-4-8 and re-points whenever the CLI ships a new alias
# table, which would silently change which model fixes your code mid-project.
model: claude-opus-5
effort: high # xhigh runs ~2x slower for marginal gain on typical findings
command:
  - claude
  - -p
  - --dangerously-skip-permissions # required to edit; see can_edit below
  - --model {{model}}
  - --effort {{effort}}
prompt_via: stdin
timeout: 30m # fixing rounds run longer than a single review pass
can_edit: true
