# The full review -> fix -> verify -> commit loop over a whole project's code.
#
# The fix- prefix means this config edits your files. Fix rounds are refused
# unless you assert the target is trusted, because the coder edits files with
# permission checks disabled and is not confined to the target: a prompt-injection
# payload in ANY reviewed file could steer it. Pass -trusted-target on the command
# line when you know what the target contains.
description: Review, fix, verify, and commit a whole project. Needs -trusted-target.

extends: defaults

roles:
  coder: { agent: claude-coder, prompt: fix }
  review:
    # rotate: each round a lens is assigned to a different agent, so fixes are
    # re-reviewed by fresh eyes rather than by the model that reported them.
    # fixed = pin every lens; all = every lens on every agent (max coverage,
    # pool-size x the cost).
    strategy: rotate
    agents: [codex, claude, gemma4, glm]
    prompts:
      - review-bugs # correctness
      - review-security # security
      - review-concurrency # concurrency
      # advisory: reported for a human, never handed to the coder, and excluded
      # from the loop's termination condition -- so an open-ended lens cannot
      # keep the run from ever converging.
      - { prompt: review-maintainability, advisory: true }
      # final: held out of the loop and run ONCE at the end, on every agent, with
      # its findings fixed like any other. Coverage is a question about finished
      # code: asked inside the loop it assessed work later rounds rewrote, so it
      # demanded tests for intermediate states and re-reported the gap each time the
      # code moved. In a five-round run that made it the largest producer (30 of 68
      # reports) and the largest waster (18 deferred), and 65% of everything the run
      # wrote was test code. Asked once at the end, by the whole panel, it is
      # bounded -- nothing follows it to starve.
      - { prompt: review-tests, final: true } # coverage of what the run changed
      # once: round 1 only. Architecture barely changes between fix rounds, so
      # this produces one report per run instead of paying a session every round.
      - { agent: claude, prompt: review-design, advisory: true, once: true }

# The deterministic gate for THIS project. fixpoint runs these itself after the
# coder and refuses to commit a round that fails them, so a fix that breaks the
# build never becomes a commit later rounds build on.
#
# Ordered cheapest-first: a formatting or vet failure stops the round before the
# slower test suite runs.
verify:
  policy: no_regressions
  timeout: 15m
  commands:
    - name: fmt
      run: [make, fmt-check]
    - name: vet
      run: [go, vet, ./...]
    - name: test
      run: [go, test, ./...]
    - name: lint
      run: [make, lint]
      optional: true # informative: a pre-existing lint debt should not block a fix
