# The Go gate: what `verify.gate: go` puts into a task config. Pure toolchain --
# nothing here assumes a Makefile, which is what the fix-* configs used to assume
# (`make fmt-check`, `make lint`) and why they only ever worked on this repository.
#
# A gate file holds exactly the two keys that change with a project's language:
# the commands the deterministic gate runs, and the test-file shape the closing
# round hides (loop.final_skip_run_edits). It cannot name another gate; the
# effective gate is always readable from two files, the config and this one.
commands:
  # gofmt -l LISTS unformatted files and exits 0 either way, so on its own it is
  # a check that can never fail. The shell wrapper turns a non-empty listing into
  # a failure -- the same thing the repository's `make fmt-check` did, without
  # needing the repository's Makefile. The `|| exit 1` on the assignment carries
  # gofmt's OWN status: an assignment's exit status is its substitution's, so a
  # gofmt that is not installed, or that exits 2 on a file it cannot parse,
  # fails the check instead of leaving stdout empty and the check green -- which
  # on a non-Go tree is exactly the vacuous pass that would keep a wrong gate
  # looking partly alive.
  - name: fmt
    run: [sh, -c, 'unformatted=$(gofmt -l .) || exit 1; test -z "$unformatted" || { echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; }']
  - name: vet
    run: [go, vet, ./...]
  # -race, not a plain `go test`. review-concurrency is a recurring loop lens, so
  # the coder edits synchronization code round after round -- and the tests that
  # guard those invariants only assert on the RESULT, so they stay green if a
  # mutex or a sync.Once is dropped. Without the detector the gate cannot see a
  # race it just committed. On this repository it costs ~70s against ~15s, far
  # inside a 15m timeout; narrow to the concurrent packages if that stops holding.
  - name: test
    run: [go, test, -race, ./...]
# The Go spelling of "a test file", for the closing round's do-not-review-your-own-
# tests rule (see defaults.yaml for the measurement behind it).
skip_run_edits: ["**/*_test.go"]
