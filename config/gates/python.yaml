# The Python gate (`verify.gate: python`). See gates/go.yaml for what a gate is.
#
# Python has no build step, so the closest thing to one is compiling every module:
# it catches syntax errors and nothing else, which is still more than the test run
# alone catches in a file no test imports. pytest is the assumption for tests; a
# project on unittest replaces the last command with
# [python3, -m, unittest, discover]. The interpreter is whichever python3 is on
# PATH -- activate the project's virtualenv before the run, or the gate tests
# against the wrong site-packages and fails on imports the project has.
commands:
  # A syntax walk, not compileall. compileall writes __pycache__ beside every
  # module it compiles (a fix commit would carry it, via `git add -A`), and the
  # first version redirected that into a temp directory removed by an EXIT trap --
  # which never runs when the gate times out, because Supervise SIGKILLs the whole
  # process group, so every timed-out attempt left a bytecode mirror in $TMPDIR.
  # ast.parse emits nothing: no cache, no temp directory, nothing to clean up.
  # The skip list keeps it out of virtualenvs and build output, which are not the
  # project's code and would make the check slow and hostage to a syntax error in
  # a dependency; a virtualenv under another name belongs on that list.
  - name: compile
    run:
      - python3
      - -c
      - |
        import ast, os, sys
        skip = {'.venv', 'venv', '.tox', '.nox', 'build', 'dist', 'node_modules', '.git', '__pycache__'}
        bad = 0
        for root, dirs, files in os.walk('.'):
            dirs[:] = sorted(d for d in dirs if d not in skip)
            for name in sorted(files):
                if not name.endswith('.py'):
                    continue
                path = os.path.join(root, name)
                try:
                    with open(path, 'rb') as fh:
                        ast.parse(fh.read(), path)
                except SyntaxError as e:
                    print(f'{path}:{e.lineno}: {e.msg}', file=sys.stderr)
                    bad += 1
        sys.exit(1 if bad else 0)
  - name: test
    run: [python3, -m, pytest, -q]
skip_run_edits: ["**/test_*.py", "**/*_test.py", "**/tests/**", "**/conftest.py"]
