# The Python gate (`verify.gate: python`). See gates/go.yaml for what a gate is.
#
# Python has no build step, so the closest thing to one is compiling every module:
# it catches syntax errors and nothing else, which is still more than the test run
# alone catches in a file no test imports. pytest is the assumption for tests; a
# project on unittest replaces the last command with
# [python3, -m, unittest, discover]. The interpreter is whichever python3 is on
# PATH -- activate the project's virtualenv before the run, or the gate tests
# against the wrong site-packages and fails on imports the project has.
commands:
  # compileall is not read-only: it writes __pycache__/*.pyc beside every module
  # it compiles, from the baseline pass on the pristine tree onward -- and the
  # round commit stages with `git add -A`, so on a project that does not ignore
  # __pycache__ every fix commit would carry bytecode the coder never wrote.
  # PYTHONPYCACHEPREFIX redirects the cache out of the tree (honoured by
  # compileall since 3.8), and the trap removes that directory again on every
  # exit -- the gate runs at the baseline and after every fix, and a mirror of
  # the project's bytecode left in $TMPDIR each time adds up. The -x regex keeps
  # it out of virtualenvs and build output, which are not the project's code and
  # would otherwise make the check slow and hostage to a syntax error in a
  # dependency; a virtualenv under another name belongs on that list.
  - name: compile
    run: [sh, -c, 'd=$(mktemp -d) || exit 1; trap ''rm -rf "$d"'' EXIT; PYTHONPYCACHEPREFIX=$d python3 -m compileall -q -x "(^|/)(\.venv|venv|\.tox|\.nox|build|dist|node_modules|\.git)/" .']
  - name: test
    run: [python3, -m, pytest, -q]
skip_run_edits: ["**/test_*.py", "**/*_test.py", "**/tests/**", "**/conftest.py"]
