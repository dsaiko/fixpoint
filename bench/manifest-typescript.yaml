# Seeded defects in bench/testdata/target-typescript. Same matcher rules as
# manifest-go.yaml. Frozen: never fix these bugs.
#
# The SAME link-shortener service as target-go, so the language is the only
# variable. See "One service, many languages" in bench/README.md.
#
# The target type-checks under `strict: true`, deliberately. Every defect here
# survives the compiler, which is the honest way to measure a TypeScript
# reviewer: the bugs tsc already catches are not the ones a review has to find.
# One seed had to be replaced for exactly that reason -- the always-true admin
# check that Go, Rust and Java all carry is a COMPILE ERROR in TypeScript, because
# control-flow narrowing proves `role !== "admin" || role !== "owner"` can never
# be false. It is replaced by the indexOf-truthiness bug, which tsc cannot see.
#
#   PARALLEL   the same logical defect as a numbered Go seed, marked
#              "parallel: Cnn".
#   TS-ONLY    defects that need this language: non-null assertions that are
#              wrong, `as any` erasing a parsed body, floating promises,
#              Math.random for secrets, `==` against a string, for..in over a
#              Map, parseInt with no radix, and Math.floor applied before the
#              multiply instead of after.
task: code
target: typescript
root: testdata/target-typescript
