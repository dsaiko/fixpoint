# Seeded defects in bench/testdata/target-java. Same matcher rules as
# manifest-go.yaml. Frozen: never fix these bugs.
#
# The SAME link-shortener service as target-go and target-rust, so the language
# is the only variable. See "One service, many languages" in bench/README.md.
#
#   PARALLEL   the same logical defect as a numbered Go seed, marked
#              "parallel: Cnn" -- these answer the cross-language question.
#   JAVA-ONLY  defects that cannot exist in Go: reference comparison on boxed
#              strings, autounboxing a null Integer, equals without hashCode,
#              a shared SimpleDateFormat, ConcurrentModificationException,
#              a swallowed InterruptedException, an unshut ExecutorService,
#              and a lazily-created singleton with no synchronization.
task: code
target: java
root: testdata/target-java
seeds:
