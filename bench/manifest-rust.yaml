# Seeded defects in bench/testdata/target-rust. Same matcher rules as
# manifest-go.yaml: a seed is FOUND when a finding names the right file, lands
# within `span` lines of the seed's anchor, and mentions at least `need` of the
# keywords. Every finding is credited to at most one seed. Frozen: never fix
# these bugs.
#
# 59 seeds, matching the Go target's 60 closely enough to compare directly.
# This target is the SAME SERVICE as target-go, deliberately: the
# domain is held constant so the language is the only variable, which is what
# makes "the field finds this bug in Go and misses it in Rust" a readable
# result rather than a confound.
#
# Two kinds of seed, and the split is the point:
#
#   PARALLEL   the same logical defect as a numbered Go seed, noted as
#              "parallel: Cnn". These answer the cross-language question --
#              does a reviewer that finds the inverted expiry in Go find it in
#              Rust? A model that scores well on Go and badly here is failing
#              at the LANGUAGE, not at the defect class.
#   RUST-ONLY  defects that only exist in this language: unwrap on absent
#              Option, atomics used non-atomically, lock poisoning, lock-order
#              inversion, integer division on usize, threads never joined.
#              These are what a Go-only bench cannot measure at all.
task: code
target: rust
root: testdata/target-rust
seeds:
