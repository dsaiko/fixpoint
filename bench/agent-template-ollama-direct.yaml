# Bench candidate over OLLAMA CLOUD DIRECTLY: the codex harness talking to
# https://ollama.com with OLLAMA_API_KEY, no local ollama server in the path.
# Same model, same payer and same harness as agent-template-ollama-codex.yaml;
# the transport is the variable -- there, the local server translates the
# responses API; here, ollama.com does.
#
# Built from config/agents/beam-ollama-direct.yaml, which carries the evidence
# for every key below. In short:
#   - the -c keys after the provider block stand in for the model catalog
#     `ollama launch codex` writes (~/.codex/model.json). Without them codex sends
#     the model its own GPT system prompt, and beam's go recall fell 26/56 from
#     40/38. The values are the catalog's for beam, glm-5.3-flash and
#     deepseek-v4.1-flash alike; check the catalog before sweeping a model whose
#     context_window is not 1048576.
#   - shell_environment_policy.exclude keeps the key out of the model's shell.
#
# EFFORT: xhigh by default, matched to the ollama-codex template; the
# ollama-direct@<tag>#<effort> suffix overrides it for a model whose catalog
# does not list xhigh (glm-5.3-flash: low, high, max). Pass the same suffix to
# the ollama-codex@ row it is compared with.
#
# COMPARABILITY: against the ollama-codex@ row of the same model and effort, run
# the SAME DAY. 2026-10-28 showed why: beam's launch route scored 109 on three
# targets that had given it 144 nine days earlier.
model: __MODEL__
effort: xhigh # overridden by an ollama-direct@<tag>#<effort> suffix; see above
command:
  - codex
  - exec
  - --ignore-user-config # no ~/.codex/config.toml: its MCP servers and plugins (Computer Use, browser) would reach a read-only reviewer
  - -c features.apps=false # nor the ChatGPT login's apps (Sites deploy, Spaces sharing), which do not come from that file
  - -c model_provider=ollama-cloud
  - -c model_providers.ollama-cloud.name=ollama-cloud
  - -c model_providers.ollama-cloud.base_url=https://ollama.com/v1
  - -c model_providers.ollama-cloud.wire_api=responses
  - -c model_providers.ollama-cloud.env_key=OLLAMA_API_KEY
  - -c shell_environment_policy.exclude=["OLLAMA_API_KEY"]
  - -c instructions=""
  - -c model_verbosity=low
  - -c model_context_window=1048576
  - -c tool_output_token_limit=10000
  - --model {{model}}
  - --sandbox read-only
  - --skip-git-repo-check
  - --color never
  - --json
  - -c model_reasoning_effort={{effort}}
  - "-" # prompt from stdin, keeping it off argv (ps / /proc)

usage:
  format: jsonl
  text: item.text
  text_when: item.type=agent_message
  input_tokens: usage.input_tokens
  output_tokens: usage.output_tokens
  cache_read_tokens: usage.cached_input_tokens
  cache_write_tokens: usage.cache_write_input_tokens
  error_text: error.message
prompt_via: stdin
timeout: 30m
can_edit: false

# The provider block reads the key; no OpenAI credential, so codex cannot fall
# back to a first-party endpoint.
env:
  pass:
    - OLLAMA_API_KEY

prompt_budget: 400000
