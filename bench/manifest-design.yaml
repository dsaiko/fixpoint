# Seeded flaws in bench/testdata/target-design/DESIGN.md. Design findings cite
# unstable line numbers, so these seeds match on keywords alone (line: 0):
# a seed is FOUND when at least `need` of its keywords appear in a finding's
# title+description, and every finding is credited to at most one seed.
# Frozen: never fix these flaws.
#
# 40 seeds, one point each; the code task carries the other 60 of the
# benchmark's 100 points. Two lenses run over this document (design-failure,
# design-data), so the seeds are split roughly evenly between what breaks when
# things go wrong (D01-D24) and what the data model gets wrong (D25-D40).
task: design
target: design
seeds:
  - id: D01
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: [idempoten, duplicate, retry, "applied twice", resend, "double"]
    note: "retrying the same POST after a timeout re-applies edits the server already wrote; no idempotency key"
  - id: D02
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: [transaction, "rows 1..N-1", partial, "roll", contradict, atomic]
    note: "§5 claims one transaction per request AND that rows 1..N-1 survive a failed row — mutually exclusive"
  - id: D03
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: [clock, skew, last-write, "wall clock", wins, discarded, "silently", "lost"]
    note: "conflict resolution by client wall clock silently discards edits, contradicting the never-lost goal"
  - id: D04
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: [wipe, 401, outbox, unsynced, refresh, "signs the user out", "local state"]
    note: "a failed token refresh wipes notes.db including the unsynced outbox — data loss on an auth hiccup"
  - id: D05
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    # "no cap", not bare "cap": \b-prefix matching makes "cap" hit "capacity"
    # and "capped", which is how D05 used to swallow D28's body-size finding.
    keywords: [unbounded, "no cap", outbox, "one request", batch, chunk, "grows", backpressure]
    note: "no outbox cap plus whole-outbox-in-one-POST: a long-offline device produces an unserviceable request"
  - id: D06
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: [SQLite, "two processes", locking, corrupt, concurrent, "both open", notes.db, CLI]
    note: "desktop client and CLI open the same SQLite file with no locking story"
  - id: D07
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: [healthz, health, liveness, database, rotation, "load balancer", dependency]
    note: "healthz checks process liveness only; an instance with a dead DB connection stays in rotation"
  - id: D08
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: [rolling, concurrently, migration, "old and new", overlap, "schema"]
    note: "rolling deploys guarantee old/new overlap; 'deploys are quick' is not a mechanism, and migrating before start breaks the old version"
  - id: D09
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: ["no request timeout", timeout, "as long as it takes", exhaust, "hold", connection, slow]
    note: "§5 removes the server-side request timeout, so a slow or hostile client holds a connection and a DB transaction open indefinitely"
  - id: D10
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: [jitter, thundering, herd, "same schedule", synchroniz, stampede, backoff, lockstep]
    note: "every client shares one backoff schedule with no jitter; after an outage they retry in lockstep"
  - id: D11
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: ["until the batch is acknowledged", forever, "max attempts", "dead letter", "give up", poison, indefinit, "never succeeds"]
    note: "retries repeat until acknowledged with no attempt limit: a batch the server will always reject retries forever"
  - id: D12
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: ["rate limit", backpressure, "tight loop", throttl, quota, abuse, "misbehaving client"]
    note: "no per-user rate limit and no backpressure; one looping client can consume the service"
  - id: D13
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: [cursor, "strictly newer", tie, "same millisecond", "same timestamp", skip, miss, monotonic]
    note: "the cursor is a millisecond timestamp compared strictly-greater: changes sharing a timestamp are skipped forever"
  - id: D14
    file: DESIGN.md
    line: 0
    span: 0
    need: 2
    keywords: ["stops sending", alert, silent, "not itself an alertable", detect, invisible, "no signal", monitor]
