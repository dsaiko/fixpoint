# Seeded defects in bench/testdata/target-python. Same matcher rules as
# manifest-go.yaml. Frozen: never fix these bugs.
#
# The SAME link-shortener service as target-go, so the language is the only
# variable. See "One service, many languages" in bench/README.md.
#
#   PARALLEL   the same logical defect as a numbered Go seed, marked
#              "parallel: Cnn".
#   PY-ONLY    defects that need this language: three mutable default arguments,
#              two bare `except:` clauses, dict-mutation during iteration, a
#              generator consumed while its source is mutated, `//` where `/`
#              was meant, random.getrandbits for secrets, and a module whose
#              import starts a thread as a side effect.
#
# `make bench-check` IMPORTS every module rather than only compiling it. That
# was not cosmetic: the first draft put the mutable-default seed on a dataclass
# field, which py_compile accepts and `import` rejects outright -- a target that
# cannot be imported is broken rather than seeded, and the check now catches it.
task: code
target: python
root: testdata/target-python
