# Seeded defects in bench/testdata/target-go. The matcher (bench/score.py)
# counts a seed as FOUND when a finding names the right file, lands within
# `span` lines of the seed's line, and mentions at least `need` of the keywords
# (case-insensitive, in title+description). Every finding is credited to at
# most one seed -- the best-matching one -- so a vague finding cannot light up
# three seeds at once. Frozen: never fix these bugs; the target's whole value is
# that it does not change between measurements.
#
# 60 seeds, one point each; the design task carries the other 40 of the
# benchmark's 100 points. Three lenses run over this target (review-bugs,
# review-concurrency, review-security).
#
# `anchor` is an exact, unique substring of the seeded line; score.py resolves
# it to a line number in `root` at scoring time, so editing the target above a
# seed cannot silently rot the manifest. Seeds with neither anchor nor line are
# matched on file and keywords alone -- used where the defect is legitimately
# reported from either of two places.
task: code
# The TARGET is the scored artifact; the TASK is the lens family run over it.
# Several targets share task: code (one per language), so results are keyed on
# target -- keying on task alone let a second language silently overwrite the
# first's row in the report.
target: go
root: testdata/target-go
seeds:
  - id: C01
    retired: true # RETIRED 2026-09-01: 90.5% of the field finds it; C04 keeps the panic family in the floor
    file: store.go
    # No line gate: the defect is legitimately reported at NewStore (the map
    # not made) or at Create (the write that panics) -- calibration saw both.
    # Two keywords, not one: a file-wide seed keyed on "quota" alone also
    # accepts the quota findings that belong to C09 and C14, and exclusive
    # matching then hands it whichever arrives first.
    need: 2
    keywords: [quota, nil, panic, "not initialized", "never initialized", "make(map", NewStore, "nil map"]
    note: "s.quota is never initialized in NewStore; first Create panics with nil-map write"
