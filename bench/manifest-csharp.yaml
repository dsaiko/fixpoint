# Seeded defects in bench/testdata/target-csharp. Same matcher rules as
# manifest-go.yaml. Frozen: never fix these bugs.
#
# The SAME link-shortener service as target-go, so the language is the only
# variable. See "One service, many languages" in bench/README.md.
#
#   PARALLEL   the same logical defect as a numbered Go seed, marked
#              "parallel: Cnn".
#   CS-ONLY    defects that need this language: `async void`, sync-over-async
#              with .Result, `lock (this)`, a Dictionary indexer that throws
#              rather than returning a zero value, collection-modified-during-
#              enumeration, deferred LINQ enumerated twice, DateTime.Now for
#              expiry, and culture-sensitive ToLower.
#
# The build emits two warnings (CS1717 self-assignment, CS0649 never-assigned
# field) and they are both seeds. That is deliberate and realistic: warnings of
# this kind are routinely ignored in real projects, and a reviewer is still
# expected to catch them.
task: code
target: csharp
root: testdata/target-csharp
