# Seeded defects in bench/testdata/target-cpp. Same matcher rules as
# manifest-go.yaml. Frozen: never fix these bugs.
#
# The SAME link-shortener service as target-go, so the language is the only
# variable. See "One service, many languages" in bench/README.md.
#
#   PARALLEL   the same logical defect as a numbered Go seed, marked
#              "parallel: Cnn".
#   CPP-ONLY   defects that only this language can have, and they are the most
#              severe on the bench: two dangling returns (a string_view and a
#              char* to a stack buffer), a strcpy buffer overflow, four
#              iterator invalidations, a leaked Entry on every eviction, threads
#              never joined so the destructor calls std::terminate, an
#              uninitialized member read, an off-by-one past the end of a
#              vector, and std::map::operator[] inserting on what reads like a
#              lookup.
#
# NOTE ON A NON-SEED: `quota_[owner] = quota_[owner] + 1` is the C01 parallel in
# every other language and is NOT a defect here -- std::map::operator[]
# value-initializes to 0. The same operator IS a defect in count_for_owner,
# where it silently inserts. Same call, opposite verdict, which is exactly the
# kind of thing a cross-language bench is for.
task: code
target: cpp
root: testdata/target-cpp
